name: Daily Entry Check

on:
  # 毎日 日本時間 18:00 (UTC 9:00) に実行
  schedule:
    - cron: '0 9 * * *'

  # 手動実行も可能
  workflow_dispatch:
    inputs:
      lookback_days:
        description: '過去何日分のデータを取得するか'
        required: false
        default: '60'
      send_no_signal:
        description: 'シグナルがない場合もSlackに通知する'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-entry-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily check
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          LOOKBACK_DAYS=${{ github.event.inputs.lookback_days || '60' }}
          SEND_NO_SIGNAL=${{ github.event.inputs.send_no_signal || 'false' }}

          if [ "$SEND_NO_SIGNAL" = "true" ]; then
            python scripts/daily_check.py --lookback-days $LOOKBACK_DAYS --send-no-signal
          else
            python scripts/daily_check.py --lookback-days $LOOKBACK_DAYS
          fi

      - name: Build dashboard
        run: python scripts/build_dashboard.py

      - name: Commit history and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history docs

          # 未追跡ファイルも拾うため、add 後のインデックスで差分を判定する
          if git diff --cached --quiet; then
            echo "判定履歴・ダッシュボードに差分なし。コミットをスキップします。"
            exit 0
          fi

          git commit -m "chore: 判定履歴とダッシュボードを更新 ($(date -u +%Y-%m-%d))"

          # 他のコミットと競合しうるのでリベースしてから push（失敗時は指数バックオフ）
          for delay in 2 4 8 16 0; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            if [ "$delay" = "0" ]; then
              echo "::error::履歴のプッシュに失敗しました"
              exit 1
            fi
            echo "プッシュに失敗しました。${delay}秒後にリトライします..."
            sleep "$delay"
          done

      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: |
            *.log
          retention-days: 7
