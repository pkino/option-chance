# Option Strategy Configuration

# データソース設定
data_sources:
  jpx:
    base_url: "https://www.jpx.co.jp/markets/derivatives/option-price"
    timeout: 30

# オプション選定条件（Tier B: コア戦略）
# selection_mode で「何を基準に銘柄を選ぶか」を排他的に決める。
#   premium = premium_range で絞り、target_premium に最も近い銘柄を選ぶ（本プロジェクトの本筋）
#   delta   = delta_range で絞り、target_delta に最も近い銘柄を選ぶ
# premium_range(20〜40円) と delta_range(-0.40〜-0.25) が指す銘柄は全く別物で、
# 20〜40円のプットはデルタ -0.01〜-0.02 の超深いOTM。両方をANDで適用すると候補が空になる。
# 詳細は docs/gate_vi_validation.md 4.2
option_selection:
  selection_mode: premium

  premium_range:
    min: 20  # 円
    max: 40  # 円
  target_premium: 30  # 最も近いプレミアムを選択（premium モード）

  dte_range:  # Days To Expiration (営業日) ≒ 暦日25〜40日
    # セータの毒が回る前に決着をつけるため、残存期間を絞る
    # 短すぎ（<18d）はセータが急激に加速、長すぎ（>28d）はベガ感応度が鈍い
    min: 18
    max: 28

  # delta モード用。premium モードでは判定に使わず、候補の参考情報として表示するのみ
  delta_range:
    min: -0.40
    max: -0.25
  target_delta: -0.30  # 最も近いデルタを選択（delta モード）

# Gate① VI安定条件
# mode: hybrid  = (絶対水準 OR 相対水準) かつ 変動係数CV かつ 傾き
#       absolute = 旧方式。絶対水準・絶対SD・傾きの4条件すべて（切り戻し用に残す）
# 絶対水準20は高VIレジーム（年平均VI>24）では年間発火ゼロになりやすく、
# VIの水準そのものはその後の急落を予測しない。詳細は docs/gate_vi_validation.md
gate_vi:
  mode: hybrid

  # 水準条件。hybrid では相対水準との OR なので、高VIレジームでの保険として機能する
  vi_threshold: 25
  vi_10d_avg_threshold: 25

  # 相対水準: 直近 vi_percentile_window 営業日におけるVIのパーセンタイル順位(%)
  # 履歴が window の半分に満たない期間は順位を算出せず、絶対水準のみで判定する
  vi_percentile_window: 252
  vi_percentile_threshold: 40

  # 安定度: 変動係数 CV = STD10 / MA10。絶対SDと違いVI水準に依存しない
  vi_10d_cv_threshold: 0.10

  # 傾き（ポイント/日）
  vi_10d_slope_threshold: 0.15  # 微上昇局面も許容（横ばい~緩やかな上昇を除外しない）

  # absolute モード専用（hybrid では未使用）
  vi_10d_std_threshold: 1.5

# Gate② 天井示唆条件
gate_top:
  # A. テクニカル（4条件のうち1つ以上）
  technical:
    required_conditions: 1  # 2→1: 複数のフィルタが独立して機能するため1条件でも十分な精度

    # A1: RSI過熱→反転
    rsi:
      period: 14
      overbought: 70
      lookback_days: 5  # 過去5営業日以内に70到達
      consecutive_decline: 2  # 2日連続低下

    # A2: MACD弱化
    macd:
      fast_period: 12
      slow_period: 26
      signal_period: 9
      hist_consecutive_decline: 3  # ヒストグラム3日連続縮小
      macd_positive: True  # MACDラインが高位（>0）

    # A3: ダイバージェンス
    divergence:
      lookback_days: 20

    # A4: 伸び切り（ボリンジャー）
    bollinger:
      period: 25
      std_dev: 2
      upper_wick_ratio: 0.4  # 上ヒゲ比率

  # B. 需給（3条件のうち1つ以上）【必須】
  supply_demand:
    required_conditions: 1

    # B1: 高値圏の出来高失速
    volume_failure:
      short_period: 5
      long_period: 20
      ratio_threshold: 0.85  # 5日平均/20日平均 <= 0.85
      high_proximity: 0.99  # 直近高値の99%以内

    # B2: 上ヒゲ優勢
    upper_wick:
      lookback_days: 3
      required_days: 2  # 3日中2日以上
      wick_ratio: 0.4
      close_from_high: 0.995  # Close <= High * 0.995

    # B3: ギャップアップ失速
    gap_up_failure:
      gap_threshold: 1.002  # Open >= 前日High * 1.002

  # C. ファンダ/マクロ（オプション：強化フラグ）
  macro:
    event_lookforward_days: 5  # 今後5営業日以内のイベント

# Trigger③ エントリートリガー
trigger:
  # 前日安値割れ OR 5日MA割れ
  prev_low_break: True
  ma5_break: True

# 退出ルール
exit_rules:
  # 損切り
  stop_loss:
    time_based_days: 5  # 5営業日で強制決済
    structural:
      new_high: True  # 直近高値更新
      indicator_reversal: True  # RSI/MACD再上向き

  # 利確
  take_profit:
    double_position_close: 0.5  # 2倍到達で50%利確
    trailing:
      mode: "A"  # A: 保守（固定日数）, B: トレーリング
      hold_days: 10  # モードAの場合の最大保有日数
      max_hold_days: 15  # モードBの場合の最大保有日数
      peak_drawdown_pct: 0.30  # モードBのトレーリング閾値

# リスク管理
risk_management:
  max_loss_pct: 0.005  # 口座資産の0.5%（0.3〜0.7%）
  max_positions: 2  # 同時保有最大2本
  no_averaging_down: True  # ナンピン禁止
  # 踏み上げ相場での資金枯渇防止：直近エントリーからN営業日は新規エントリー抑制
  # 「今回こそ暴落だ」と小刻みに全損を繰り返す前に、本物の暴落への弾丸を温存する
  entry_cooldown_days: 5

# バックテスト設定
backtest:
  lookback_years: 5
  slippage:
    entry: "ask"  # エントリーはask
    exit: "bid"   # イグジットはbid
  commission: 0  # 後で追加

# 通知設定
notifications:
  slack:
    enabled: True
    webhook_env: "SLACK_WEBHOOK_URL"

# イベント日付（手動管理）
# フォーマット: YYYY-MM-DD
events:
  # 例: 日銀会合、FOMC、CPI、メジャーSQなど
  # - "2024-12-19"
  # - "2024-12-20"
  - "2025-12-17"
  - "2025-12-18"
